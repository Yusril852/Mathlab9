'1.4':[r=>{const x=nz(r,-8,8);let y;do y=nz(r,-8,8);while(y==x);const k=pk(r,[2,3,4,-2,-3]);return{q:`Titik A${pt(x,y)} didilatasi dengan pusat O(0, 0) dan faktor skala ${k}. Bayangan A' adalah ...`,a:pt(k*x,k*y),w:[pt(x+k,y+k),pt(k*y,k*x),pt(-k*x,-k*y),pt(k*x,y)],e:`Pusat O: (x, y) → (kx, ky) = (${k}×${x}, ${k}×${y}) = ${pt(k*x,k*y)}.`,t:['dilatasi']}},
r=>{const x=nz(r,-6,6),y=nz(r,-6,6),h=nz(r,-4,4),j=nz(r,-4,4),k=pk(r,[2,3,-2]),X=h+k*(x-h),Y=j+k*(y-j);return{q:`Titik A${pt(x,y)} didilatasi dengan pusat P${pt(h,j)} dan faktor skala ${k}. Bayangan A' adalah ...`,a:pt(X,Y),w:[pt(k*x,k*y),pt(h+k*x,j+k*y),pt(k*(x-h),k*(y-j)),pt(x+k*h,y+k*j)],e:`x' = h + k(x − h) = ${h} + ${k}(${x-h}) = ${X}; y' = ${j} + ${k}(${y-j}) = ${Y}.`,t:['dilatasi','pusat bukan O']}},
r=>{const p=ri(r,2,9),l=ri(r,2,9),k=ri(r,2,4);return{q:`Persegi panjang berukuran ${p} cm × ${l} cm didilatasi dengan faktor skala ${k}. Luas bayangannya adalah ... cm².`,a:k*k*p*l,w:[k*p*l,(k+1)*p*l,k*k*(p+l),2*k*p*l],e:`Panjang dan lebar dikali ${k}: ${k*p} × ${k*l}. Luas = ${k*k*p*l}. Luas berubah ${k*k} kali (kuadrat skala), bukan ${k} kali.`,t:['penalaran','dilatasi','luas']}}],
'3.6':[r=>{const a=ri(r,1,3),b=nz(r,-8,8),c=nz(r,-6,6),D=b*b-4*a*c,O=['dua akar real berbeda','dua akar real sama','tidak memiliki akar real','satu akar real dan satu tidak real'],i=D>0?0:D==0?1:2;return{q:`Persamaan ${poly(a,b,c)} = 0 memiliki ...`,a:O[i],w:O.filter((x,j)=>j!=i),e:`D = b² − 4ac = ${b*b} − 4(${a})(${c}) = ${D}. ${D>0?'D > 0 → dua akar real berbeda.':D==0?'D = 0 → dua akar real sama.':'D < 0 → tidak memiliki akar real.'}`,t:['jenis akar','diskriminan']}},
r=>{const a=ri(r,1,3),b=nz(r,-8,8),c=nz(r,-6,6),D=b*b-4*a*c,sq=Number.isInteger(Math.sqrt(D)),O=['dua akar rasional berbeda','dua akar irasional berbeda','dua akar rasional kembar','tidak memiliki akar real'],i=D<0?3:D==0?2:sq?0:1;return{q:`Persamaan ${poly(a,b,c)} = 0 memiliki ...`,a:O[i],w:O.filter((x,j)=>j!=i),e:`D = ${b*b} − 4(${a})(${c}) = ${D}. ${D<0?'D < 0, tidak ada akar real.':D==0?'D = 0, akar kembar (rasional).':sq?`D = ${Math.sqrt(D)}² adalah kuadrat sempurna, akar rasional berbeda.`:'D > 0 tetapi bukan kuadrat sempurna, akar irasional berbeda.'}`,t:['jenis akar','diskriminan']}},
r=>{const a=ri(r,1,4),m=ri(r,1,6),b=(r()<.5?-1:1)*2*a*m,k=a*m*m;return{q:`Persamaan ${a==1?'':a}x² ${b>0?'+':'−'} ${Math.abs(b)}x + k = 0 memiliki dua akar real yang sama. Nilai k adalah ...`,a:k,w:[4*k,2*k,k+a,k+1],e:`Akar sama → D = 0. b² − 4ak = 0 → ${b*b} − ${4*a}k = 0 → k = ${b*b}/${4*a} = ${k}.`,t:['penalaran','diskriminan']}}],
'3.7':[r=>{let p,q;do{p=nz(r,-9,9);q=nz(r,-9,9)}while(p+q==0);const a=ri(r,2,4),b=-a*(p+q),c=a*p*q;return{q:`Jumlah akar-akar persamaan ${poly(a,b,c)} = 0 adalah ...`,a:p+q,w:[-(p+q),b,p*q,c],e:`Jumlah akar = −b/a = −(${b})/${a} = ${p+q}.`,t:['jumlah akar']}},
r=>{let p,q;do{p=nz(r,-9,9);q=nz(r,-9,9)}while(p+q==0);const a=ri(r,2,4),b=-a*(p+q),c=a*p*q;return{q:`Hasil kali akar-akar persamaan ${poly(a,b,c)} = 0 adalah ...`,a:p*q,w:[c,-(p*q),p+q,b],e:`Hasil kali akar = c/a = ${c}/${a} = ${p*q}.`,t:['hasil kali akar']}},
r=>{let p,q;do{p=nz(r,-9,9);q=nz(r,-9,9)}while(p+q==0);const b=-(p+q),c=p*q,S=b*b-2*c;return{q:`Jika x₁ dan x₂ akar-akar persamaan ${poly(1,b,c)} = 0, nilai x₁² + x₂² adalah ...`,a:S,w:[b*b-c,b*b+2*c,b*b-4*c,c*c-2*b],e:`x₁ + x₂ = ${-b}, x₁·x₂ = ${c}. x₁² + x₂² = (x₁ + x₂)² − 2x₁x₂ = ${b*b} − 2(${c}) = ${S}.`,t:['penalaran','hubungan akar']}}],
'4.2':[r=>{const a=ri(r,2,9),b=ri(r,2,9),s=ri(r,2,6),c=a*s;return{q:`Dua segitiga sebangun. Sisi yang bersesuaian pada segitiga pertama adalah ${a} cm dan ${b} cm. Pada segitiga kedua, sisi yang bersesuaian dengan ${a} cm adalah ${c} cm. Panjang sisi yang bersesuaian dengan ${b} cm adalah ... cm.`,a:b*s,w:[b+c-a,b+c,b*(s+1),b*s-s],e:`Skala = ${c}/${a} = ${s}. Sisi = ${b} × ${s} = ${b*s} cm. (Kesebangunan memakai perbandingan, bukan selisih.)`,t:['perbandingan sisi']}},
r=>{let g,h;do{g=ri(r,2,5);h=ri(r,2,5)}while(g==h);const u=ri(r,1,4),v=ri(r,1,4);return{q:`Dua persegi panjang sebangun. Persegi panjang pertama berukuran ${u*g} cm × ${v*g} cm. Panjang persegi panjang kedua ${u*h} cm. Lebar persegi panjang kedua adalah ... cm.`,a:v*h,w:[v*g+u*h-u*g,v*g,v*(h+1),v*h-1],e:`Perbandingan panjang = ${u*h}/${u*g} = ${h}/${g}. Lebar kedua = ${v*g} × ${h}/${g} = ${v*h} cm.`,t:['perbandingan sisi','persegi panjang']}},
r=>{const t=ri(r,2,9),s=ri(r,2,9),k=ri(r,2,9);return{q:`Tongkat setinggi ${t} m memiliki bayangan ${s} m. Pada saat yang sama, bayangan sebuah pohon ${s*k} m. Tinggi pohon adalah ... m.`,a:t*k,w:[s*k,t+k,(t+s)*k,t*s],e:`Sinar matahari sejajar, sehingga segitiga tongkat dan pohon sebangun: tinggi/${t} = ${s*k}/${s} → tinggi = ${t} × ${k} = ${t*k} m.`,t:['penalaran','kesebangunan','cerita']}}],
'5.8':[r=>{const j=ri(r,1,3),u=ri(r,1,12),R=7*j,t=3*u,V=154*j*j*u;return{q:`Sebuah kerucut berjari-jari ${R} cm dan tinggi ${t} cm. Dengan π = 22/7, volume kerucut adalah ... cm³.`,a:V,w:[V*3,V/2,V*2,V+t],e:`V = ⅓πr²t = ⅓ × 22/7 × ${R} × ${R} × ${t} = ${V} cm³.`,t:['volume kerucut']}},
r=>{const T=pk(r,[[3,4,5],[5,12,13],[8,15,17],[12,5,13],[6,8,10],[9,12,15],[7,24,25],[15,8,17]]),j=ri(r,1,4),R=T[0]*j,t=T[1]*j,s=T[2]*j;return{q:`Sebuah kerucut berjari-jari ${R} cm dan garis pelukis ${s} cm. Volume kerucut tersebut adalah ... π cm³.`,a:R*R*t/3,w:[R*R*t,R*(R+s),R*s,R*R*t/2],e:`1) Tinggi: t = √(${s}² − ${R}²) = √${s*s-R*R} = ${t} cm. 2) V = ⅓πr²t = ⅓ × ${R*R} × ${t} π = ${R*R*t/3}π.`,t:['volume kerucut','pythagoras']}},
r=>{const m=ri(r,5,150);return{q:`Sebuah tabung dan sebuah kerucut memiliki jari-jari dan tinggi yang sama. Jika volume tabung ${3*m} cm³, volume kerucut adalah ... cm³.`,a:m,w:[9*m,3*m,2*m,m+3],e:`Volume tabung = πr²t, volume kerucut = ⅓πr²t. Jadi volume kerucut = ⅓ × ${3*m} = ${m} cm³.`,t:['penalaran','volume kerucut']}}],
'5.9':[r=>{const R=ri(r,2,40);return{q:`Luas permukaan bola berjari-jari ${R} cm adalah ... π cm².`,a:4*R*R,w:[2*R*R,4*R,R*R,4*R*R*R],e:`L = 4πr² = 4π × ${R}² = ${4*R*R}π cm².`,t:['luas bola']}},
r=>{const d=2*ri(r,2,40);return{q:`Sebuah bola berdiameter ${d} cm. Luas permukaannya adalah ... π cm².`,a:d*d,w:[4*d*d,d*d/2,2*d,d*d*d],e:`Jari-jari = ${d}/2 = ${d/2} cm. L = 4π(${d/2})² = ${d*d}π cm².`,t:['luas bola']}},
r=>{const R=ri(r,2,40);return{q:`Sebuah belahan bola padat berjari-jari ${R} cm. Luas seluruh permukaannya (termasuk alas) adalah ... π cm².`,a:3*R*R,w:[2*R*R,4*R*R,R*R,3*R],e:`Bagian lengkung = ½ × 4πr² = 2πr² = ${2*R*R}π. Alas lingkaran = πr² = ${R*R}π. Total = ${3*R*R}π cm².`,t:['penalaran','luas bola']}}],
'0.4':[r=>{const m=pk(r,[2,3,5,6,7]),a=ri(r,3,12),b=ri(r,2,a-1),pl=r()<.5,v=pl?a+b:a-b;return{q:`Hasil dari ${a}√${m} ${pl?'+':'−'} ${b}√${m} adalah ...`,a:`${cf(v)}√${m}`,w:[`${cf(pl?a-b:a+b)}√${m}`,`${cf(v)}√${m*2}`,`${a*b}√${m}`,`${v}`],e:`Akar sejenis (√${m}), koefisien dioperasikan: ${a} ${pl?'+':'−'} ${b} = ${v}. Hasilnya ${cf(v)}√${m}.`,t:['operasi akar']}},
r=>{const m=pk(r,[2,3,5,6,7]),a=ri(r,2,7),b=ri(r,2,7);return{q:`Hasil dari √${a*a*m} + √${b*b*m} adalah ...`,a:`${a+b}√${m}`,w:[`√${m*(a*a+b*b)}`,`${a+b}√${m*2}`,`${a*b}√${m}`,`${a*a+b*b}√${m}`],e:`Sederhanakan dulu: √${a*a*m} = ${a}√${m} dan √${b*b*m} = ${b}√${m}. Jumlahkan: ${a+b}√${m}. (Akar tidak boleh dijumlahkan di dalam tanda akar.)`,t:['operasi akar','menyederhanakan']}},
r=>{let p,q;const L=[2,3,5,6,7,10,11,13,14,15];do{p=pk(r,L);q=pk(r,L)}while(p==q||gcd(p,q)>1);return{q:`Bentuk paling sederhana dari (√${p} + √${q})² adalah ...`,a:`${p+q} + 2√${p*q}`,w:[`${p+q}`,`${p+q} + √${p*q}`,`${p+q} + 2√${p+q}`,`${p+q} − 2√${p*q}`],e:`(a + b)² = a² + 2ab + b². Maka ${p} + 2√${p}√${q} + ${q} = ${p+q} + 2√${p*q}. (Jangan lupa suku tengah 2ab.)`,t:['penalaran','kuadrat bentuk akar']}}],
'0.6':[r=>{const n=pk(r,[2,3]),k=n==2?ri(r,2,30):ri(r,2,9),x=k**n;return{q:`Nilai dari ${x}^(1/${n}) adalah ...`,a:k,w:[k+1,k-1,k*n,x-k],e:`Pangkat 1/${n} berarti akar pangkat ${n}. ${n==2?'√':'∛'}${x} = ${k}, karena ${k}${sup(n)} = ${x}.`,t:['pangkat pecahan']}},

r=>{const p=ri(r,2,12),q=ri(r,2,9);return{q:`Nilai dari ${p*p}^(1/2) × ${q**3}^(1/3) adalah ...`,a:p*q,w:[p+q,2*p*q,p*q+p,p*p*q],e:`${p*p}^(1/2) = ${p} dan ${q**3}^(1/3) = ${q}. Kalikan: ${p} × ${q} = ${p*q}.`,t:['penalaran','pangkat pecahan']}}],
'1.3':[r=>{const x=nz(r,-8,8);let y;do y=nz(r,-8,8);while(Math.abs(y)==Math.abs(x));const g=pk(r,[90,180,270]);return{q:`Titik A${pt(x,y)} diputar ${g}° berlawanan arah jarum jam dengan pusat O(0, 0). Bayangan A' adalah ...`,a:Rot(g,x,y),w:[90,180,270].filter(t=>t!=g).map(t=>Rot(t,x,y)).concat([pt(y,x)]),e:`Rotasi ${g}° pusat O: ${g==90?'(x, y) → (−y, x)':g==180?'(x, y) → (−x, −y)':'(x, y) → (y, −x)'} = ${Rot(g,x,y)}.`,t:['rotasi']}},
r=>{let x,y,h,k;do{x=nz(r,-6,6);y=nz(r,-6,6);h=nz(r,-4,4);k=nz(r,-4,4)}while(x==h&&y==k);const cw=r()<.5,X=cw?h+(y-k):h-(y-k),Y=cw?k-(x-h):k+(x-h);return{q:`Titik A${pt(x,y)} diputar 90° ${cw?'searah':'berlawanan arah'} jarum jam dengan pusat P${pt(h,k)}. Bayangan A' adalah ...`,a:pt(X,Y),w:[pt(-y,x),cw?pt(h-(y-k),k+(x-h)):pt(h+(y-k),k-(x-h)),pt(2*h-x,2*k-y),pt(y,-x)],e:`Geser pusat ke O: (${x-h}, ${y-k}). Putar 90° ${cw?'searah':'berlawanan'} jarum jam: ${cw?`(${y-k}, ${-(x-h)})`:`(${-(y-k)}, ${x-h})`}. Geser kembali (+${h}, +${k}): ${pt(X,Y)}.`,t:['rotasi','pusat bukan O']}},
r=>{const x=nz(r,-8,8);let y;do y=nz(r,-8,8);while(Math.abs(y)==Math.abs(x));const a1=pk(r,[90,180,270]),a2=pk(r,[90,180,270]),T=(a1+a2)%360;return{q:`Titik A${pt(x,y)} diputar ${a1}° lalu diputar lagi ${a2}° (keduanya berlawanan arah jarum jam, pusat O). Bayangan akhir A'' adalah ...`,a:Rot(T,x,y),w:[0,90,180,270].filter(t=>t!=T).map(t=>Rot(t,x,y)),e:`Dua rotasi dengan pusat sama dapat digabung: ${a1}° + ${a2}° = ${a1+a2}° ${a1+a2>=360?`≡ ${T}°`:''}. ${T==0?'Kembali ke posisi semula':'Rotasi '+T+'°'}: ${Rot(T,x,y)}.`,t:['penalaran','komposisi rotasi']}}],
'2.4':[r=>{const n=ri(r,20,150),f=ri(r,5,n-5);return{q:`Sebuah koin dilempar ${n} kali dan muncul sisi angka sebanyak ${f} kali. Peluang empirik muncul sisi angka adalah ...`,a:fr(f,n),w:[fr(n-f,n),fr(n,f),fr(f,n+f),fr(f,n-f)],e:`Peluang empirik = banyak kejadian yang muncul ÷ banyak percobaan = ${f}/${n}${fr(f,n)!=f+'/'+n?' = '+fr(f,n):''}.`,t:['peluang empirik']}},
r=>{const n=ri(r,30,120);let a,b;do{a=ri(r,3,n/4|0);b=ri(r,3,n/4|0)}while(a==b);return{q:`Sebuah dadu dilempar ${n} kali. Mata dadu 6 muncul ${a} kali dan mata dadu 1 muncul ${b} kali. Peluang empirik muncul mata dadu 1 atau 6 adalah ...`,a:fr(a+b,n),w:[fr(a,n),fr(b,n),fr(a*b,n),fr(a+b,n-a-b)],e:`Kejadian "1 atau 6" muncul ${a} + ${b} = ${a+b} kali. Peluang empirik = ${a+b}/${n}${fr(a+b,n)!=(a+b)+'/'+n?' = '+fr(a+b,n):''}.`,t:['peluang empirik','gabungan kejadian']}},
r=>{const n=ri(r,2,10)*10,f=ri(r,2,9),u=ri(r,2,9);return{q:`Dalam ${n} kali percobaan, kejadian A muncul ${f} kali. Jika percobaan dilakukan ${n*u} kali dengan kondisi yang sama, perkiraan banyak kejadian A muncul adalah ... kali.`,a:f*u,w:[f+u,n*u-f,f*u+n,f*n],e:`Peluang empirik A = ${f}/${n}. Perkiraan untuk ${n*u} percobaan = ${f}/${n} × ${n*u} = ${f*u} kali. (Skala percobaan naik ${u} kali, maka kejadian ikut naik ${u} kali.)`,t:['penalaran','peluang empirik']}}],
'3.3':[r=>{let p,q;do{p=nz(r,-9,9);q=nz(r,-9,9)}while(p==q||p+q==0);return{q:`Bentuk faktor dari ${poly(1,p+q,p*q)} adalah ...`,a:`(x ${fz(p)})(x ${fz(q)})`,w:[`(x ${fz(-p)})(x ${fz(q)})`,`(x ${fz(p)})(x ${fz(-q)})`,`(x ${fz(-p)})(x ${fz(-q)})`],e:`Cari dua bilangan yang jumlahnya ${p+q} dan hasil kalinya ${p*q}: yaitu ${p} dan ${q}. Maka (x ${fz(p)})(x ${fz(q)}).`,t:['faktorisasi']}},
r=>{let u,v;do{u=ri(r,1,9);v=ri(r,1,9)}while(u==v);return{q:`Akar positif dari persamaan ${poly(1,v-u,-u*v)} = 0 adalah ...`,a:u,w:[v,-u,u+v,u*v],e:`Dua bilangan dengan jumlah ${v-u} dan hasil kali ${-u*v}: ${-u} dan ${v}. Maka (x ${fz(-u)})(x ${fz(v)}) = 0, akarnya x = ${u} atau x = ${-v}. Akar positifnya ${u}.`,t:['faktorisasi','akar']}},

function freshSet(k,L){const pk=k+'-'+L,prev=PREV[pk]||new Set,seen=new Set,out=[];for(let t=0;out.length<25&&t<3000;t++){const seed=2000+Math.floor(Math.random()*9e8);let q=null;try{q=generateQuestion({key:k,level:L,seed})}catch(e){}if(!q)continue;q.id=idOf(k,L,0).slice(0,-3)+'s'+seed;const d=dk(q);if(seen.has(d)||(t<1500&&prev.has(d))||validateQuestion(q).length)continue;seen.add(d);out.push(q)}if(out.length<25)bank(k,L).forEach(q=>{if(out.length<25&&!seen.has(dk(q))){seen.add(dk(q));out.push(q)}});PREV[pk]=seen;return out}
function validateQuestion(q){const e=[];if(!q.id)e.push('ID kosong');if(![1,2,3].includes(q.level))e.push('level tidak valid');if(!B.some(b=>b.n==q.bab&&b.s.includes(q.subBab)))e.push('bab/sub-bab tidak valid');
 if(!q.pertanyaan||/undefined|NaN/.test(q.pertanyaan+q.pilihan+q.pembahasan+(q.gambar||'')))e.push('soal malformed');if(!q.pembahasan)e.push('pembahasan kosong');if(q.gambar&&!q.gambar.startsWith('<svg'))e.push('gambar tidak valid');
 if(!q.jawaban)e.push('jawaban kosong');const T=q.tipe;
 if(T=='numeric'){if(!Number.isFinite(q.val))e.push('jawaban numerik tidak valid')}
 else if(T=='matching'){if(!q.pairs||q.pairs.length<3||new Set(q.pairs.map(p=>p[1])).size!=q.pairs.length)e.push('pasangan tidak unik')}
 else{if(q.pilihan.filter(x=>x===q.jawaban).length!=1)e.push('jawaban tidak tepat satu');if(new Set(q.pilihan).size!=q.pilihan.length||q.pilihan.length!=(T=='true_false'?2:4))e.push('opsi duplikat / jumlah opsi salah')}
 return e}
